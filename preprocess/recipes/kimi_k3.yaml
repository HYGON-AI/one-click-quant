# Kimi-K3 preprocess recipe
#
# Architecture glue lives in preprocess/adapters/kimi_k3.py (NOT in this YAML).
# This file only selects: adapter id, transform order, and include seeds.
#
# Flow: MXFP4 unpack (adapter.prepare_weights) → quarot → flex_awq_ssz → flex_smooth.
#
# Subgraph split:
#   - flex_awq_ssz: UpDown seeds → adapter.resolve_up_down (w3→w2)
#   - flex_smooth_quant: NormLinear seeds → adapter LN map (full consumers)
# Do NOT list experts.*.w3 under flex_smooth.

adapter: kimi_k3

# Dequant MXFP4 → BF16 is done by streaming unpack to ``{save-dir}.bf16_staging``
# BEFORE multi-GPU transforms (avoids RAM OOM). Set false if input is already BF16.
unpack_mxfp4: true

transforms:
  - quarot
  - flex_awq_ssz
  - flex_smooth_quant

quarot:
  block_size: 32
  seed: 1234
  fuse_ln: true
  # Optional smoke limits (unset = full model):
  # max_layers: 2
  # max_experts: 8

flex_awq_ssz:
  search_step: 0.1
  ssz_step: 10
  use_calib_acts: false
  include:
    - language_model.model.layers.*.block_sparse_moe.experts.*.w3

flex_smooth_quant:
  search_step: 0.1
  use_calib_acts: false
  include:
    # Seeds only; full Norm consumers come from KimiK3Adapter.build_ln_fuse_map
    - language_model.model.layers.*.block_sparse_moe.shared_experts.up_proj
    - language_model.model.layers.0.mlp.up_proj
    - language_model.model.layers.*.block_sparse_moe.routed_expert_up_proj
